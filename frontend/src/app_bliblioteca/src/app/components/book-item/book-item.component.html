<div class="book-item d-flex">
    <div *ngIf="book.rank" class="book-top-number">{{ book.rank }}.</div>
    <img [src]="book.img" alt="{{ book.titulo }}" class="img-fluid">
    <div class="book-info">
        <h3>{{ book.titulo }}</h3>
        <p class="author">{{ book.autor[0].apodo }}</p>
        <p class="synopsis">{{ book.sinopsis }}</p>
        <div class="rating-save d-flex align-items-center">
            <div class="rating me-2">
                <app-rating [valor]="book.promedio_valoracion"></app-rating>
            </div>
        </div>
        <div class="save-icon ms-auto">
            <i class="fas fa-bookmark"></i>
        </div>
    </div>
</div>
